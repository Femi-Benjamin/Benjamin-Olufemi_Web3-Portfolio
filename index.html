<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benjamin Olufemi | Frontend & Web3 Developer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Space Grotesk", "sans-serif"],
            },
            colors: {
              void: {
                DEFAULT: "#000000",
                light: "#f9fafb",
              },
              glass: {
                DEFAULT: "rgba(255, 255, 255, 0.03)",
                light: "rgba(0, 0, 0, 0.02)",
              },
              "neon-cyan": "#00f2fe", // Windows electric cyan
              "neon-blue": "#0072ff", // Windows electric blue
              "neon-purple": "#6366f1", // Premium Indigo
              gray: {
                450: "#64748b",
                550: "#475569",
                650: "#334155", // High contrast slate-700
                750: "#1e293b", // High contrast slate-800
                850: "#0f172a", // High contrast slate-900
                950: "#020617", // High contrast slate-950
              },
              zinc: {
                350: "#94a3b8",
                450: "#64748b",
                550: "#475569",
                650: "#334155", // High contrast slate-700
                750: "#1e293b", // High contrast slate-800
              },
            },
            animation: {
              "float-slow": "float 10s ease-in-out infinite",
              "float-medium": "float 7s ease-in-out infinite",
              "float-fast": "float 5s ease-in-out infinite",
            },
            keyframes: {
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-20px)" },
              },
            },
          },
        },
      };
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      html,
      body {
        background-color: #e5e7eb; /* Tailwind gray-200 background */
        color: #0f172a; /* Strong readable slate-900 */
        overflow-x: hidden;
        width: 100%;
        max-width: 100%;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      html.dark,
      html.dark body {
        background-color: #0b0c16; /* Pave's dark slate-navy background */
        color: #f3f4f6;
      }
      /* Dotted grid background pattern - only on tablet and desktop (min-width: 768px) */
      @media (min-width: 768px) {
        html,
        body {
          background-image: radial-gradient(#9ca3af 1.2px, transparent 1.2px); /* Gray-400 dots */
          background-size: 24px 24px;
        }
        html.dark,
        html.dark body {
          background-image: radial-gradient(#22253a 1.2px, transparent 1.2px); /* Dark mode dots */
          background-size: 24px 24px;
        }
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(15, 23, 42, 0.08); /* Clean dark slate border outline */
        transition:
          background-color 0.3s ease,
          border-color 0.3s ease;
      }
      html.dark .glass-panel {
        background: rgba(16, 18, 48, 0.65); /* Translucent navy glass */
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(0, 198, 255, 0.12); /* Subtle cyan-blue tinted border */
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
