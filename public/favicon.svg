<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    circle.outline {
      stroke: rgba(0, 114, 255, 0.3);
    }
    text.logo-text {
      fill: #1f2937;
    }
    circle.dot {
      fill: #0072ff;
    }
    @media (prefers-color-scheme: dark) {
      circle.outline {
        stroke: rgba(0, 242, 254, 0.6);
      }
      text.logo-text {
        fill: #ffffff;
      }
      circle.dot {
        fill: #00f2fe;
      }
    }
  </style>
  <circle cx="50" cy="50" r="40" class="outline" stroke-width="3.5" />
  <text x="49" y="52" font-family="Georgia, serif" font-size="34" font-weight="bold" class="logo-text" text-anchor="middle" dominant-baseline="central">BO</text>
  <circle cx="86" cy="67" r="6.5" class="dot" />
</svg>
